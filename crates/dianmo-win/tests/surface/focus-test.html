<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>点墨焦点测试</title>
<style>
  body { font: 20px "Microsoft YaHei UI", sans-serif; margin: 16px; }
  .row { display: flex; gap: 16px; margin-bottom: 12px; align-items: center; }
  input, textarea, button, [contenteditable] { font: inherit; width: 340px; height: 44px; box-sizing: border-box; }
  textarea, [contenteditable] { height: 64px; border: 1px solid #888; }
  label { width: 120px; }
  p { width: 700px; }
</style>
</head>
<body>
  <div class="row"><label>text</label><input id="txt" type="text"><label>search</label><input id="srch" type="search"></div>
  <div class="row"><label>number</label><input id="num" type="number"><label>password</label><input id="pw" type="password"></div>
  <div class="row"><label>url</label><input id="url" type="url"><label>email</label><input id="mail" type="email"></div>
  <div class="row"><label>textarea</label><textarea id="area"></textarea><label>editable</label><div id="ce" contenteditable="true"></div></div>
  <div class="row"><label>readonly</label><input id="ro" type="text" readonly value="只读"><label>button</label><button id="btn">按钮</button></div>
  <p id="para">这是一段普通文字，点它不应该弹出键盘。</p>
</body>
</html>
