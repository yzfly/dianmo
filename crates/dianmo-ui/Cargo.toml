[package]
name = "dianmo-ui"
description = "Dianmo keyboard UI: layouts, candidate bar, gestures; draws through the Canvas trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dianmo-core = { path = "../dianmo-core" }

# Dev-only: software renderer for `examples/preview.rs` (PNG previews on the Linux server).
# Not used by the library, so the shipping build is unaffected.
[dev-dependencies]
tiny-skia = "0.11"
ab_glyph = "0.2"
