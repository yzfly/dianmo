  <rect x="232" y="268" width="560" height="560" rx="130" fill="#1E1B6B" fill-opacity="0.35"/>
  <rect x="232" y="224" width="560" height="560" rx="130" fill="url(#cap)"/>
  <path d="M512 326 C560 392 630 464 630 546 A118 118 0 1 1 394 546 C394 464 464 392 512 326 Z" fill="url(#ink)"/>
