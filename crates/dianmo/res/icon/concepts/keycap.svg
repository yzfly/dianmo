<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Alternative concept 「键帽·墨滴」: a white keycap carrying a gradient ink drop. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C8F0"/>
      <stop offset="0.55" stop-color="#4F6BF5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.95" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.6" stop-color="#7C3AED"/>
